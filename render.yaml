# Render Blueprint for the BakeOps API — two environments:
#   main branch → bakeops-api-dev  (dev)
#   prod branch → bakeops-api      (production)
# Dev redeploys by itself when main passes CI. Production is deployed only by the
# "Deploy to production" GitHub workflow (tests → deploy hook → wait until live).
# Setup: Render dashboard → New → Blueprint → pick this repo. See backend/README.md → "Deploying".

previews:
  generation: "off"

services:
  - type: web
    name: bakeops-api-dev
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    # Dev dependencies (prisma CLI, typescript) are needed to build, even with NODE_ENV=production.
    # Migrations run here because the free plan has no pre-deploy step.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # dev database — Neon direct (non-pooled) URL for the dev branch (see README)
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

  - type: web
    name: bakeops-api
    runtime: node
    plan: free
    region: singapore
    branch: prod
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Production never deploys by itself: .github/workflows/deploy-prod.yml runs the
    # tests and then triggers it through the service's Deploy Hook.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # production database — a different one from dev
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

  # The public website (bakeops.me): brand pages + customer order tracking (issue #29).
  # A free static site, built from `website/` with Next.js static export.
  - type: web
    name: bakeops-site
    runtime: static
    branch: prod
    rootDir: website
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeployTrigger: commit
    # Every tracking link is served by the one static tracking page, which reads
    # the shop and order from the URL.
    routes:
      - type: rewrite
        source: /track/*
        destination: /track/index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://bakeops-api-njig.onrender.com
      - key: NEXT_PUBLIC_APK_URL
        sync: false # latest APK link, once the first build exists (#26)
      - key: NEXT_PUBLIC_WHATSAPP
        sync: false
      - key: NEXT_PUBLIC_EMAIL
        sync: false
