name: Feature request
description: New functionality or an improvement
title: "[Feature]: "
labels: ["enhancement", "status: open"]
body:
  - type: markdown
    attributes:
      value: |
        This issue follows the workflow **Open → In Progress → RFT → In Testing → UAT Tested → Closed**.
        See [ISSUE_WORKFLOW.md](../blob/main/.github/ISSUE_WORKFLOW.md) for the commands.
  - type: textarea
    id: problem
    attributes:
      label: Problem / goal
      description: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What should be built?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: QA and UAT test against these. Make each one checkable.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (API)
        - Frontend (app)
        - Both
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Designs / notes
