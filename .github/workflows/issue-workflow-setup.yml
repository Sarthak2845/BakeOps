name: Issue workflow setup

# Run once (Actions → Issue workflow setup → Run workflow) to create the
# status and QA labels. Safe to re-run; it updates colours/descriptions.

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const wf = require('./.github/scripts/issue-workflow.js');
            await wf.ensureLabels({ github, context, core });
